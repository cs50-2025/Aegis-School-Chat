<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Suppress benign dev-proxy HMR websocket logs in iframe environment per environment guidelines -->
    <script>
      (function() {
        function isViteWs(val) {
          if (!val) return false;
          const text = typeof val === 'string' ? val : (val.message || val.stack || String(val) || '');
          return text.includes('WebSocket') || text.includes('[vite]');
        }

        const origError = console.error;
        console.error = function(...args) {
          const combined = args.map(a => (a && (a.message || a.stack || String(a))) || '').join(' ');
          if (combined.includes('WebSocket') && (combined.includes('[vite]') || combined.includes('closed without opened'))) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          const msg = (event && (event.message || (event.error && event.error.message) || '')) + '';
          if (msg.includes('WebSocket') || (msg.includes('[vite]') && msg.includes('closed'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = (reason && (reason.message || String(reason)) || '') + '';
          if (msg.includes('WebSocket') || (msg.includes('[vite]') && msg.includes('closed'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aegis - School-Safe PWA Chat & Collab</title>
    <meta name="description" content="School-safe real-time communication PWA featuring profanity blur filters, AI image moderation, WebRTC screen share with host safety killswitch, audio rooms, and AI unread chat summarizer." />

    <meta property="og:description" content="School-safe real-time communication PWA featuring profanity blur filters, AI image moderation, WebRTC screen share with host safety killswitch, audio rooms, and AI unread chat summarizer." />
